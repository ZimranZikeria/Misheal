<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Misheal ❤️</title>

<!-- Handwriting Font -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Great Vibes', cursive;
    background: linear-gradient(135deg, #ffd1dc, #ffe6eb);
    color: #333;
    text-align: center;
    overflow: hidden;
  }

  /* 🌸 Loading Screen */
  #loading {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: url('https://png.pngtree.com/png-clipart/20230124/original/pngtree-watercolor-flowers-background-png-image_8921837.png') center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 999;
    animation: fadeOut 1s ease 3s forwards;
  }

  #loading h1 {
    color: #e91e63;
    font-size: 3em;
    animation: fadeIn 2s ease-in-out infinite alternate;
  }

  @keyframes fadeIn {
    from { opacity: 0.5; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1.05); }
  }

  @keyframes fadeOut {
    to { opacity: 0; visibility: hidden; }
  }

  /* 🌹 Scrollable Message Section */
  .scroll-area {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-behavior: smooth;
    display: none;
    padding-bottom: 60px;
  }

  /* 💌 Message Box */
  .container {
    max-width: 700px;
    margin: 80px auto;
    padding: 25px 20px;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 25px;
    box-shadow: 0 4px 25px rgba(0, 0, 0, 0.1);
    backdrop-filter: blur(6px);
    line-height: 1.7;
    font-size: 1.3em;
    white-space: pre-line;
    animation: fadeInMain 2s ease forwards;
    position: relative;
    z-index: 2;
  }

  @keyframes fadeInMain {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .heart {
    font-size: 2em;
    color: #e91e63;
    animation: pulse 1.5s infinite;
    margin-top: 15px;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
  }

  .heart-float {
    position: absolute;
    color: #ff6b81;
    font-size: 1.5em;
    animation: floatUp 6s linear infinite;
    opacity: 0.8;
    z-index: 1;
  }

  @keyframes floatUp {
    from { transform: translateY(100vh) scale(0.8); opacity: 0.8; }
    to { transform: translateY(-10vh) scale(1.5); opacity: 0; }
  }

  #typedText {
    display: inline-block;
    text-align: left;
    white-space: pre-wrap;
  }

  audio {
    margin-top: 20px;
    opacity: 0.8;
  }

  /* 💞 Buttons */
  .response-buttons {
    margin-top: 30px;
  }

  .response-buttons button {
    font-size: 18px;
    padding: 10px 25px;
    border: none;
    border-radius: 10px;
    background: #e91e63;
    color: #fff;
    cursor: pointer;
    margin: 5px;
    transition: transform 0.2s;
  }

  .response-buttons button:hover {
    transform: scale(1.1);
  }

  .note {
    color: red;
    font-size: 0.8em;
    margin-top: 10px;
  }
</style>
</head>

<body>

  <!-- 🌸 Loading Screen -->
  <div id="loading">
    <h1>Misheal...</h1>
  </div>

  <!-- 🌹 Scrollable Wrapper -->
  <div class="scroll-area" id="scrollArea">
    <div class="container" id="message">
      <div id="typedText"></div>

      <!-- ❤️ Heart -->
      <div class="heart">❤️</div>

      <!-- 🎵 Music -->
      <audio id="music" autoplay loop>
        <source src="https://dl.dropboxusercontent.com/scl/fi/8qfx43kw4w00q5v4bup4f/Husn-Anuv-Jain.mp3?rlkey=7o2p1u0n43t4x59n1kluy4rvh" type="audio/mp3">
      </audio>

      <!-- 💞 Yes/No Buttons -->
      <div class="response-buttons">
        <button onclick="alert('She said Yes ❤️')">Yes</button>
        <button onclick="alert('She said No 😢')">No</button>
        <div class="note">Note: kindly reply it on Instagram please</div>
      </div>
    </div>
  </div>

<script>
  const fullText = `Misheal,

Ik its been months ab.
We aren't the same ab.
Ik tujy mein tang karta ho.
Sorry ❤️
Chota Baby, Aunty G.

I teased you a lot.
TBH, idk how to say or explain to you
how much I've missed you.
I've missed my Laadi.

Laadi,
Idk what to say or what to type,
meray pass words nahi.
How to tell you
how much I'm interested into you,
want us to be back together,
and start it in a new way —
the way it should be.

We both did wrong,
we will make it right.

I still remember our date,
the first time I saw you,
the first time I held your hand,
and the way you were being —
it was so cute and funny ❤️

Ik it was hard for you,
it bothered you a lot.
Sorry, Madam G.

(Don’t worry, I’ll tease you sari zindagi 😄)

You said I’m ganda bacha.
Ap meri apology kabool nahi karo gyi ab? 🥺

Ik we aren’t that couple ab...
But surely,
I’d love to make it right.

Ik you’ll tu hurt hogah...
It’s not about getting hurt or feelings,
It’s about the commitment we both did —
that we would stay together
and wouldn’t let any misunderstanding
or problem destroy our relationship.

Ik it’s too early that I’m asking,
It’s your choice,
It’s your life.
If it’s a No — it’s Okay.
Or wanna take time — that’s Okay too.

Would you like to be mine again? 💞

Misheal,
I love you more than myself.
You don’t know how much I’ve prayed
for you to be mine.

Chota Baby ❤️`;

  window.onload = () => {
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('scrollArea').style.display = 'block';
      startTyping();
      createHearts();
      const music = document.getElementById('music');
      music.play().catch(() => {});
    }, 3500);
  };

  // Typing animation
  let i = 0;
  function startTyping() {
    const textContainer = document.getElementById('typedText');
    if (i < fullText.length) {
      textContainer.textContent += fullText.charAt(i);
      i++;
      setTimeout(startTyping, 35);
    }
  }

  // Floating hearts
  function createHearts() {
    for (let j = 0; j < 8; j++) {
      let heart = document.createElement('div');
      heart.classList.add('heart-float');
      heart.innerHTML = '❤';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (5 + Math.random() * 3) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }
    setInterval(() => {
      for (let j = 0; j < 8; j++) {
        let heart = document.createElement('div');
        heart.classList.add('heart-float');
        heart.innerHTML = '❤';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (5 + Math.random() * 3) + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 7000);
      }
    }, 4000);
  }
</script>

</body>
</html>
